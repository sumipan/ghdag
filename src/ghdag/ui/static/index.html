<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ghdag Dashboard</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #c9d1d9;
  --text-muted: #8b949e;
  --accent: #58a6ff;
  --ok: #3fb950;
  --fail: #f85149;
  --running: #d29922;
  --pending: #8b949e;
  --rejected: #bc8cff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  padding: 16px;
}
h1 {
  font-size: 1.25rem;
  font-weight: 600;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
h1 .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--ok);
  display: inline-block;
  flex-shrink: 0;
}
h1 .dot.disconnected { background: var(--fail); }
.meta {
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-bottom: 12px;
}
.table-wrapper {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
table {
  width: 100%;
  min-width: 480px;
  border-collapse: collapse;
  font-size: 0.8125rem;
}
thead th {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  color: var(--text-muted);
  font-weight: 600;
  white-space: nowrap;
  position: sticky;
  top: 0;
  background: var(--bg);
}
tbody td {
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
tbody tr:hover { background: var(--surface); }
.col-tree { white-space: pre; font-family: "SF Mono", "Fira Code", monospace; font-size: 0.75rem; }
.col-state { white-space: nowrap; }
.col-engine { white-space: nowrap; color: var(--text-muted); }
.col-uuid { font-family: "SF Mono", monospace; font-size: 0.6875rem; color: var(--text-muted); }
.col-label { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.col-actions { white-space: nowrap; }

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 0.6875rem;
  font-weight: 600;
}
.badge-ok        { background: rgba(63,185,80,0.15); color: var(--ok); }
.badge-fail      { background: rgba(248,81,73,0.15); color: var(--fail); }
.badge-running   { background: rgba(210,153,34,0.15); color: var(--running); }
.badge-pending   { background: rgba(139,148,158,0.1); color: var(--pending); }
.badge-rejected  { background: rgba(188,140,255,0.15); color: var(--rejected); }
.badge-empty     { background: rgba(139,148,158,0.1); color: var(--pending); }
.badge-unknown   { background: rgba(139,148,158,0.1); color: var(--pending); }

.btn-retry, .btn-stop {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 0.6875rem;
  font-weight: 600;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-retry:hover {
  background: rgba(248,81,73,0.15);
  color: var(--fail);
  border-color: var(--fail);
}
.btn-stop:hover {
  background: rgba(210,153,34,0.15);
  color: var(--running);
  border-color: var(--running);
}
.btn-retry:disabled, .btn-stop:disabled {
  opacity: 0.4;
  cursor: default;
}

.link-order {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 0.6875rem;
  font-weight: 600;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  text-decoration: none;
  transition: all 0.15s;
  cursor: pointer;
}
.link-order:hover {
  background: rgba(88,166,255,0.15);
  color: var(--accent);
  border-color: var(--accent);
}

.link-result {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 0.6875rem;
  font-weight: 600;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  text-decoration: none;
  transition: all 0.15s;
  cursor: pointer;
}
.link-result:hover {
  background: rgba(63,185,80,0.15);
  color: var(--ok);
  border-color: var(--ok);
}

.empty-msg {
  text-align: center;
  padding: 48px 16px;
  color: var(--text-muted);
}
.header-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.header-row h1 { margin-bottom: 0; }
.limit-select {
  font-size: 0.75rem;
  color: var(--text-muted);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 2px 6px;
  cursor: pointer;
  margin-left: auto;
}
.limit-select:focus { outline: none; border-color: var(--accent); }

.tab-bar { display: flex; gap: 4px; margin-bottom: 12px; }
.tab-btn {
  background: var(--surface); color: var(--text-muted); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 0.8125rem;
}
.tab-btn.active { color: var(--accent); border-color: var(--accent); }

@media (max-width: 768px) {
  .hide-mobile { display: none; }
  table { font-size: 0.75rem; min-width: 320px; }
  .col-tree { font-size: 0.6875rem; }
  .col-label { max-width: 160px; }
  body { padding: 8px; }
  h1 { font-size: 1rem; }
}
@media (max-width: 480px) {
  .col-label { max-width: 100px; }
  body { padding: 6px; }
}
</style>
</head>
<body>

<div class="header-row">
  <h1>
    <span class="dot" id="status-dot"></span>
    ghdag Dashboard
  </h1>
  <select class="limit-select" id="limit-select">
    <option value="20" selected>20 rows</option>
    <option value="40">40 rows</option>
    <option value="60">60 rows</option>
    <option value="80">80 rows</option>
    <option value="100">100 rows</option>
  </select>
</div>
<div class="tab-bar">
  <button class="tab-btn active" data-tab="tasks" data-i18n="tab_tasks">Tasks</button>
  <button class="tab-btn" data-tab="bursts" data-i18n="tab_bursts">Bursts</button>
</div>
<div class="meta" id="meta">Connecting...</div>

<div id="tasks-view">
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th data-i18n="col_time_tree">Time / Tree</th>
          <th data-i18n="col_state">State</th>
          <th class="hide-mobile" data-i18n="col_engine_model">Engine / Model</th>
          <th class="hide-mobile">UUID</th>
          <th data-i18n="col_label">Label</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="empty-msg" id="empty-msg" style="display:none" data-i18n="empty_tasks">No tasks</div>
</div>

<div id="bursts-view" style="display:none">
  <table>
    <thead>
      <tr><th>correlation_id</th><th data-i18n="col_count">Count</th><th data-i18n="col_last_seen">Last seen</th></tr>
    </thead>
    <tbody id="bursts-tbody"></tbody>
  </table>
  <div class="empty-msg" id="bursts-empty" style="display:none" data-i18n="empty_bursts">No burst data</div>
</div>

<script>
(function() {
  const tbody = document.getElementById('tbody');
  const meta = document.getElementById('meta');
  const dot = document.getElementById('status-dot');
  const emptyMsg = document.getElementById('empty-msg');
  const limitSelect = document.getElementById('limit-select');
  let rowCount = 0;
  const retryingUuids = {};  // uuid -> 'pending' | 'done' | 'error'
  const stoppingUuids = {};  // uuid -> 'pending' | 'done' | 'error'
  let githubBaseUrl = null;
  let currentEs = null;
  const i18n = { ui: {} };

  // Strings default to the English markup; /api/config i18n.ui overrides them
  function uiText(value, fallback) {
    return typeof value === 'string' && value ? value : fallback;
  }

  function applyI18n() {
    document.querySelectorAll('[data-i18n]').forEach(function(el) {
      el.textContent = uiText(i18n.ui[el.dataset.i18n], el.textContent);
    });
    Array.prototype.forEach.call(limitSelect.options, function(opt) {
      opt.textContent = uiText(i18n.ui.page_size_option, '{n} rows').replace('{n}', opt.value);
    });
  }

  // Load GitHub base URL and language pack from config once
  fetch('/api/config')
    .then(function(r) { return r.json(); })
    .then(function(cfg) {
      githubBaseUrl = cfg.github_base_url || null;
      if (cfg.i18n && cfg.i18n.ui) i18n.ui = cfg.i18n.ui;
      applyI18n();
    })
    .catch(function() {});

  const OK_STATES = ['ok', 'unknown'];
  const FAIL_STATES = ['fail', 'rejected', 'empty', 'engine_error'];
  const PENDING_STATES = ['pending_deps', 'pending_run'];
  const RETRYABLE_STATES = ['fail', 'rejected', 'empty', 'unknown'];

  function badgeClass(stateId) {
    if (OK_STATES.indexOf(stateId) >= 0) return 'badge-ok';
    if (FAIL_STATES.indexOf(stateId) >= 0) return 'badge-fail';
    if (stateId === 'running') return 'badge-running';
    if (PENDING_STATES.indexOf(stateId) >= 0) return 'badge-pending';
    return 'badge-unknown';
  }

  function isDone(stateId) {
    return OK_STATES.indexOf(stateId) >= 0 || FAIL_STATES.indexOf(stateId) >= 0;
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function isRetryable(stateId) {
    return RETRYABLE_STATES.indexOf(stateId) >= 0;
  }

  function isStoppable(stateId) {
    return stateId === 'running';
  }

  function retryTask(uuid, btn) {
    btn.disabled = true;
    btn.textContent = '...';
    retryingUuids[uuid] = 'pending';
    fetch('/api/retry', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ uuid: uuid })
    }).then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.ok) {
          retryingUuids[uuid] = 'done';
          setTimeout(function() { delete retryingUuids[uuid]; }, 5000);
        } else {
          retryingUuids[uuid] = 'error';
          setTimeout(function() { delete retryingUuids[uuid]; }, 5000);
        }
        renderCurrentRows();
      })
      .catch(function() {
        retryingUuids[uuid] = 'error';
        setTimeout(function() { delete retryingUuids[uuid]; }, 5000);
        renderCurrentRows();
      });
  }

  function stopTask(uuid, btn) {
    if (!confirm(uiText(i18n.ui.confirm_stop, 'Force-stop the agent process?'))) return;
    btn.disabled = true;
    btn.textContent = '...';
    stoppingUuids[uuid] = 'pending';
    fetch('/api/stop', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ uuid: uuid })
    }).then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.ok) {
          stoppingUuids[uuid] = 'done';
          setTimeout(function() { delete stoppingUuids[uuid]; }, 5000);
        } else {
          stoppingUuids[uuid] = 'error';
          setTimeout(function() { delete stoppingUuids[uuid]; }, 5000);
        }
        renderCurrentRows();
      })
      .catch(function() {
        stoppingUuids[uuid] = 'error';
        setTimeout(function() { delete stoppingUuids[uuid]; }, 5000);
        renderCurrentRows();
      });
  }

  function buildFileUrl(filePath) {
    return githubBaseUrl + '/blob/main/' + filePath;
  }

  function buildOrderLink(orderPath) {
    if (!orderPath || !githubBaseUrl) return '';
    var uri = buildFileUrl(orderPath);
    return '<a class="link-order" href="' + escapeHtml(uri) + '" target="_blank" rel="noopener" title="' + escapeHtml(orderPath) + '">order</a>';
  }

  function buildResultLink(resultPath) {
    if (!resultPath || !githubBaseUrl) return '';
    var uri = buildFileUrl(resultPath);
    return '<a class="link-result" href="' + escapeHtml(uri) + '" target="_blank" rel="noopener" title="' + escapeHtml(resultPath) + '">result</a>';
  }

  var lastRows = [];

  function renderRows(rows) {
    lastRows = rows;
    rowCount = rows.length;
    if (rowCount === 0) {
      tbody.innerHTML = '';
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';
    const html = rows.map(function(r) {
      var actions = '';

      // order link
      if (r.order_path) {
        actions += buildOrderLink(r.order_path) + ' ';
      }

      // stop button (running) or result link (completed)
      var ss = stoppingUuids[r.uuid];
      if (ss === 'pending') {
        actions += '<button class="btn-stop" disabled>...</button> ';
      } else if (ss === 'done') {
        actions += '<span class="btn-stop" style="color:var(--ok)">stopped</span> ';
      } else if (ss === 'error') {
        actions += '<button class="btn-stop" onclick="window._stop(\'' + escapeHtml(r.uuid) + '\', this)">stop</button> ';
      } else if (isDone(r.state_id) && r.result_path) {
        actions += buildResultLink(r.result_path) + ' ';
      } else if (isStoppable(r.state_id)) {
        actions += '<button class="btn-stop" onclick="window._stop(\'' + escapeHtml(r.uuid) + '\', this)">stop</button> ';
      }

      // retry button
      var rs = retryingUuids[r.uuid];
      if (rs === 'pending') {
        actions += '<button class="btn-retry" disabled>...</button>';
      } else if (rs === 'done') {
        actions += '<span class="btn-retry" style="color:var(--ok)">done</span>';
      } else if (rs === 'error') {
        actions += '<button class="btn-retry" onclick="window._retry(\'' + escapeHtml(r.uuid) + '\', this)">retry</button>';
      } else if (isRetryable(r.state_id)) {
        actions += '<button class="btn-retry" onclick="window._retry(\'' + escapeHtml(r.uuid) + '\', this)">retry</button>';
      }

      return '<tr>'
        + '<td class="col-tree">' + escapeHtml(r.tree_ts) + '</td>'
        + '<td class="col-state"><span class="badge ' + badgeClass(r.state_id) + '">' + escapeHtml(r.state) + '</span></td>'
        + '<td class="col-engine hide-mobile">' + escapeHtml(r.engine_model) + '</td>'
        + '<td class="col-uuid hide-mobile">' + escapeHtml(r.uuid) + '</td>'
        + '<td class="col-label">' + escapeHtml(r.cmd_preview) + '</td>'
        + '<td class="col-actions">' + actions + '</td>'
        + '</tr>';
    }).join('');
    tbody.innerHTML = html;
  }

  function renderCurrentRows() {
    if (lastRows.length > 0) renderRows(lastRows);
  }

  window._retry = retryTask;
  window._stop = stopTask;

  function getLimit() {
    return limitSelect.value;
  }

  function connect() {
    if (currentEs) { currentEs.close(); currentEs = null; }
    const limit = getLimit();
    const es = new EventSource('/api/stream?max_visible=' + limit);
    currentEs = es;
    es.onopen = function() {
      dot.classList.remove('disconnected');
      meta.textContent = 'Connected — streaming updates';
    };
    es.onmessage = function(e) {
      try {
        const rows = JSON.parse(e.data);
        renderRows(rows);
        const now = new Date().toLocaleTimeString();
        meta.textContent = 'Updated ' + now + ' — ' + rowCount + ' tasks';
      } catch (err) {
        console.error('Parse error:', err);
      }
    };
    es.onerror = function() {
      dot.classList.add('disconnected');
      meta.textContent = 'Disconnected — retrying...';
      es.close();
      currentEs = null;
      setTimeout(connect, 3000);
    };
  }

  limitSelect.addEventListener('change', function() {
    fetch('/api/rows?max_visible=' + getLimit())
      .then(function(r) { return r.json(); })
      .then(renderRows)
      .catch(function() {});
    connect();
  });

  function fetchBursts() {
    fetch('/api/correlation-bursts?hours=1&top_n=20')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var tbody = document.getElementById('bursts-tbody');
        var emptyMsg = document.getElementById('bursts-empty');
        if (!data.bursts || data.bursts.length === 0) {
          tbody.innerHTML = '';
          emptyMsg.style.display = '';
          return;
        }
        emptyMsg.style.display = 'none';
        tbody.innerHTML = data.bursts.map(function(b) {
          return '<tr><td>' + escapeHtml(b.correlation_id) + '</td>'
            + '<td>' + b.count + '</td>'
            + '<td>' + escapeHtml(b.latest_timestamp) + '</td></tr>';
        }).join('');
      });
  }

  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var tab = btn.dataset.tab;
      document.getElementById('tasks-view').style.display = tab === 'tasks' ? '' : 'none';
      document.getElementById('bursts-view').style.display = tab === 'bursts' ? '' : 'none';
      if (tab === 'bursts') fetchBursts();
    });
  });

  // Initial fetch then switch to SSE
  fetch('/api/rows?max_visible=' + getLimit())
    .then(function(r) { return r.json(); })
    .then(renderRows)
    .catch(function() {});
  connect();
})();
</script>
</body>
</html>
