[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghdag"
version = "0.32.0"
description = "Generic DAG execution engine extracted from graph-watcher"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["watchdog>=4.0.0", "pyyaml>=6.0", "requests>=2.28.0"]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "mypy>=1.10.0",
  "ruff>=0.4.0",
  "import-linter>=2.0",
  "types-PyYAML>=6.0",
]

[project.scripts]
ghdag = "ghdag.cli:main"

[project.urls]
Repository = "https://github.com/sumipan/ghdag"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ghdag.ui" = ["static/*"]
"ghdag" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = false
warn_return_any = true
warn_unused_configs = true
packages = ["ghdag"]
mypy_path = "src"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"src/ghdag/cli/**" = ["E501"]
"src/ghdag/dag/engine.py" = ["F841", "E501"]
"src/ghdag/dag/hooks.py" = ["E501"]
"src/ghdag/dag/parser.py" = ["F401"]
"tests/**" = ["E501"]
"tests/pipeline/test_audit_hooks.py" = ["F401"]
"tests/test_ghdag_parser.py" = ["F401"]
"tests/test_pipeline_status.py" = ["F401", "E402"]

[tool.importlinter]
root_packages = ["ghdag"]

[[tool.importlinter.contracts]]
name = "Infrastructure must not import orchestration"
type = "forbidden"
source_modules = [
  "ghdag.files",
  "ghdag.llm",
  "ghdag.metrics",
]
forbidden_modules = [
  "ghdag.pipeline",
  "ghdag.workflow",
  "ghdag.ui",
  "ghdag.cli",
]

[[tool.importlinter.contracts]]
name = "core は ghdag の他パッケージに依存しない"
type = "forbidden"
source_modules = ["ghdag.core"]
forbidden_modules = [
  "ghdag.io",
  "ghdag.files",
  "ghdag.llm",
  "ghdag.metrics",
  "ghdag.github_client",
  "ghdag.github_cli",
  "ghdag.dag",
  "ghdag.pipeline",
  "ghdag.workflow",
  "ghdag.cli",
  "ghdag.ui",
  "ghdag.cleanup",
  "ghdag.maintenance",
  "ghdag.tool",
  "ghdag.markdown",
]

[[tool.importlinter.contracts]]
name = "投入塔は実行塔を import しない（通信は exec.jsonl / done のみ）"
type = "forbidden"
source_modules = ["ghdag.pipeline", "ghdag.workflow"]
forbidden_modules = ["ghdag.dag"]
ignore_imports = [
  "ghdag.pipeline.hooks -> ghdag.dag.audit_hooks",
]

[[tool.importlinter.contracts]]
name = "実行塔は投入塔を import しない"
type = "forbidden"
source_modules = ["ghdag.dag"]
forbidden_modules = ["ghdag.pipeline", "ghdag.workflow"]
ignore_imports = [
  "ghdag.dag.audit_hooks -> ghdag.pipeline.audit",
]

[[tool.importlinter.contracts]]
name = "io / effects は塔と入口を知らない"
type = "forbidden"
source_modules = [
  "ghdag.io",
  "ghdag.files",
  "ghdag.llm",
  "ghdag.metrics",
  "ghdag.github_client",
]
forbidden_modules = [
  "ghdag.dag",
  "ghdag.pipeline",
  "ghdag.workflow",
  "ghdag.cli",
  "ghdag.ui",
]

[[tool.importlinter.contracts]]
name = "ops は実行系に依存しない"
type = "forbidden"
source_modules = [
  "ghdag.cleanup",
  "ghdag.maintenance",
  "ghdag.tool",
  "ghdag.markdown",
]
forbidden_modules = [
  "ghdag.dag",
  "ghdag.pipeline",
  "ghdag.workflow",
  "ghdag.cli",
  "ghdag.ui",
]

[[tool.mypy.overrides]]
module = [
  "ghdag.cleanup",
  "ghdag.dag._util",
  "ghdag.dag.engine",
  "ghdag.dag.watcher",
  "ghdag.llm._config",
  "ghdag.llm.engines",
  "ghdag.metrics.models",
  "ghdag.pipeline.state",
  "ghdag.ui.monitor",
  "ghdag.ui.server",
]
ignore_errors = true
