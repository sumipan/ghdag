[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghdag"
version = "0.24.1"
description = "Generic DAG execution engine extracted from graph-watcher"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["watchdog>=4.0.0", "pyyaml>=6.0"]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "mypy>=1.10.0"]

[project.scripts]
ghdag = "ghdag.cli:main"

[project.urls]
Repository = "https://github.com/sumipan/ghdag"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ghdag.ui" = ["static/*"]
"ghdag" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = false
warn_return_any = true
warn_unused_configs = true
packages = ["ghdag"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
  "ghdag.cleanup",
  "ghdag.cli",
  "ghdag.dag._util",
  "ghdag.dag.engine",
  "ghdag.dag.fanout",
  "ghdag.dag.watcher",
  "ghdag.files.reader",
  "ghdag.llm._config",
  "ghdag.llm.engines",
  "ghdag.metrics.models",
  "ghdag.pipeline.state",
  "ghdag.pipeline.wait",
  "ghdag.ui.monitor",
  "ghdag.ui.server",
  "ghdag.workflow.dispatcher",
  "ghdag.workflow.github",
  "ghdag.workflow.loader",
]
ignore_errors = true
