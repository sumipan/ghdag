[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghdag"
version = "0.133.3"
description = "Generic DAG execution engine extracted from graph-watcher"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["watchdog>=4.0.0", "pyyaml>=6.0"]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-timeout>=2.3.1",
  "pytest-cov>=4.0.0",
  "mypy>=1.10.0",
  "ruff>=0.4.0",
  "import-linter>=2.0",
  "types-PyYAML>=6.0",
  "jsonschema>=4.0",
]

[project.scripts]
ghdag = "ghdag.cli:main"

[project.urls]
Repository = "https://github.com/sumipan/ghdag"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ghdag.ui" = ["static/*"]
"ghdag" = ["py.typed"]
"ghdag.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 300

[tool.mypy]
strict = false
warn_return_any = true
warn_unused_configs = true
packages = ["ghdag"]
mypy_path = "src"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"src/ghdag/cli/**" = ["E501"]
"src/ghdag/dag/engine.py" = ["F841", "E501"]
"src/ghdag/dag/hooks.py" = ["E501"]
"src/ghdag/dag/parser.py" = ["F401"]
"tests/**" = ["E501"]
"tests/pipeline/test_audit_hooks.py" = ["F401"]
"tests/test_ghdag_parser.py" = ["F401"]
"tests/test_pipeline_status.py" = ["F401", "E402"]

[tool.importlinter]
root_packages = ["ghdag"]

[[tool.importlinter.contracts]]
name = "Infrastructure must not import orchestration"
type = "forbidden"
source_modules = [
  "ghdag.files",
  "ghdag.llm",
  "ghdag.metrics",
]
forbidden_modules = [
  "ghdag.pipeline",
  "ghdag.workflow",
  "ghdag.ui",
  "ghdag.cli",
]

[[tool.importlinter.contracts]]
name = "core must not import other ghdag packages"
type = "forbidden"
source_modules = ["ghdag.core"]
forbidden_modules = [
  "ghdag.io",
  "ghdag.files",
  "ghdag.llm",
  "ghdag.metrics",
  "ghdag.github_client",
  "ghdag.github_cli",
  "ghdag.dag",
  "ghdag.pipeline",
  "ghdag.workflow",
  "ghdag.cli",
  "ghdag.ui",
  "ghdag.cleanup",
  "ghdag.maintenance",
  "ghdag.tool",
]

[[tool.importlinter.contracts]]
name = "Intake tower must not import the runner tower (they share exec.jsonl / done only)"
type = "forbidden"
source_modules = ["ghdag.pipeline", "ghdag.workflow"]
forbidden_modules = ["ghdag.dag"]
ignore_imports = []

[[tool.importlinter.contracts]]
name = "Runner tower must not import the intake tower"
type = "forbidden"
source_modules = ["ghdag.dag"]
forbidden_modules = ["ghdag.pipeline", "ghdag.workflow"]

[[tool.importlinter.contracts]]
name = "io / effects must not import the towers or entry points"
type = "forbidden"
source_modules = [
  "ghdag.io",
  "ghdag.files",
  "ghdag.llm",
  "ghdag.metrics",
  "ghdag.github_client",
  "ghdag.vcs",
]
forbidden_modules = [
  "ghdag.dag",
  "ghdag.pipeline",
  "ghdag.workflow",
  "ghdag.cli",
  "ghdag.ui",
  "ghdag.quota",
]
ignore_imports = [
  "ghdag.llm.managed -> ghdag.quota",
]

[[tool.importlinter.contracts]]
name = "ops must not import the execution packages"
type = "forbidden"
source_modules = [
  "ghdag.cleanup",
  "ghdag.maintenance",
  "ghdag.tool",
]
forbidden_modules = [
  "ghdag.dag",
  "ghdag.pipeline",
  "ghdag.workflow",
  "ghdag.cli",
  "ghdag.ui",
]

[[tool.importlinter.contracts]]
name = "quota must not import the orchestration packages"
type = "forbidden"
source_modules = ["ghdag.quota"]
forbidden_modules = [
  "ghdag.dag",
  "ghdag.pipeline",
  "ghdag.workflow",
  "ghdag.cli",
  "ghdag.ui",
]

[[tool.importlinter.contracts]]
name = "MCP must not import dag, workflow, ui, or cli"
type = "forbidden"
source_modules = ["ghdag.mcp"]
forbidden_modules = [
  "ghdag.dag",
  "ghdag.workflow",
  "ghdag.ui",
  "ghdag.cli",
]
